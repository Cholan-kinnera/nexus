<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 50" width="800" height="50" style="background:transparent;">
  <style>
    .typing-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-weight: 500;
      fill: #e4e4e7;
      font-size: 20px;
      dominant-baseline: middle;
      text-anchor: middle;
    }
    .text-1 { animation: swap1 9s infinite; opacity: 0; }
    .text-2 { animation: swap2 9s infinite; opacity: 0; }
    .text-3 { animation: swap3 9s infinite; opacity: 0; }

    @keyframes swap1 { 0%, 30% { opacity: 1; } 33.3%, 100% { opacity: 0; } }
    @keyframes swap2 { 33.3%, 63.3% { opacity: 1; } 0%, 33.2%, 66.6%, 100% { opacity: 0; } }
    @keyframes swap3 { 66.6%, 96.6% { opacity: 1; } 0%, 66.5%, 100% { opacity: 0; } }
  </style>
  <text x="400" y="25" class="typing-text text-1">AI-Powered Project Management</text>
  <text x="400" y="25" class="typing-text text-2">Built with FastAPI + React 19</text>
  <text x="400" y="25" class="typing-text text-3">Live at nexuspm.online</text>
</svg>
