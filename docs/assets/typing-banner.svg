<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120" style="background:#09090b; border-radius:12px; border:1px solid #27272a;">
  <style>
    .typing-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-weight: 700;
      fill: #a78bfa;
      font-size: 24px;
    }
    .cursor {
      fill: #7c3aed;
      animation: blink 0.8s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .text-1 { animation: swap1 18s infinite; opacity: 0; }
    .text-2 { animation: swap2 18s infinite; opacity: 0; }
    .text-3 { animation: swap3 18s infinite; opacity: 0; }
    .text-4 { animation: swap4 18s infinite; opacity: 0; }
    .text-5 { animation: swap5 18s infinite; opacity: 0; }
    .text-6 { animation: swap6 18s infinite; opacity: 0; }

    @keyframes swap1 { 0%, 15% { opacity: 1; } 16%, 100% { opacity: 0; } }
    @keyframes swap2 { 16.6%, 31.6% { opacity: 1; } 0%, 16.5%, 31.7%, 100% { opacity: 0; } }
    @keyframes swap3 { 33.3%, 48.3% { opacity: 1; } 0%, 33.2%, 48.4%, 100% { opacity: 0; } }
    @keyframes swap4 { 50%, 65% { opacity: 1; } 0%, 49.9%, 65.1%, 100% { opacity: 0; } }
    @keyframes swap5 { 66.6%, 81.6% { opacity: 1; } 0%, 66.5%, 81.7%, 100% { opacity: 0; } }
    @keyframes swap6 { 83.3%, 98.3% { opacity: 1; } 0%, 83.2%, 98.4%, 100% { opacity: 0; } }
  </style>
  
  <circle cx="25" cy="25" r="6" fill="#ef4444" />
  <circle cx="45" cy="25" r="6" fill="#f59e0b" />
  <circle cx="65" cy="25" r="6" fill="#10b981" />

  <g transform="translate(45, 75)">
    <g>
      <text class="typing-text text-1">AI-Powered Project Management Platform</text>
      <text class="typing-text text-2">FastAPI + React 19 SaaS</text>
      <text class="typing-text text-3">Built for Modern Teams</text>
      <text class="typing-text text-4">Production-Ready Architecture</text>
      <text class="typing-text text-5">Cloud Native Workspace</text>
      <text class="typing-text text-6">Powered by Gemini AI</text>
    </g>
  </g>
</svg>
