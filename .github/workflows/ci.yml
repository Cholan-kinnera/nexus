name: Nexus PM CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-audit:
    name: Security & Code Quality Audits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pip-audit

      - name: Check Python Code Formatting (Black)
        run: black --check .

      - name: Lint Python Code (Ruff)
        run: ruff check .

      - name: Audit Python Vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit Frontend Vulnerabilities (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=moderate

  frontend-ci:
    name: Frontend Quality & Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Linting
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

  database-ci:
    name: Alembic Migration Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: nexus_pm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci_postgres_password@localhost:5432/nexus_pm
        run: |
          alembic upgrade head

      - name: Verify Migration Head Status
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci_postgres_password@localhost:5432/nexus_pm
        run: |
          alembic current

  backend-ci:
    name: Backend Imports & Unit Tests
    runs-on: ubuntu-latest
    needs: database-ci

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: nexus_pm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Validate Python Syntax & Imports
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci_postgres_password@localhost:5432/nexus_pm
          SECRET_KEY: ci_secret_key_123_signature_verification_jwt
        run: |
          python -m compileall -q .
          python -c "import main"

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci_postgres_password@localhost:5432/nexus_pm
          SECRET_KEY: ci_secret_key_123_signature_verification_jwt
        run: |
          python -m unittest discover -s tests

  docker-backend-ci:
    name: Backend Container Build Verification
    runs-on: ubuntu-latest
    needs: backend-ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Image Build
        run: docker build -t nexus-backend:test .

  docker-frontend-ci:
    name: Frontend Container Build Verification
    runs-on: ubuntu-latest
    needs: frontend-ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Frontend Image Build
        run: docker build -t nexus-frontend:test -f frontend/Dockerfile --build-arg VITE_API_URL=http://localhost:8000 .
